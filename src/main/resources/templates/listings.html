<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Listings</title>
</head>

<body>

<h1>Manage listings</h1>

<p th:if="${success}" th:text="${success}"></p>
<p th:if="${error}" th:text="${error}"></p>

<form th:action="@{/admin/listings}" method="get">
    <label for="q">Title or owner</label>
    <input id="q" name="q" type="text" th:value="${q}">

    <label for="status">Status</label>
    <select id="status" name="status">
        <option value="">Any status</option>
        <option th:each="option : ${statuses}"
                th:value="${option}"
                th:text="${option.label}"
                th:selected="${option == selectedStatus}"></option>
    </select>

    <button type="submit">Search</button>
    <a th:href="@{/admin/listings}">Clear filters</a>
</form>

<p th:if="${listings.isEmpty()}">No listings match your search.</p>

<table th:unless="${listings.isEmpty()}">
    <thead>
    <tr>
        <th>Title</th><th>Owner</th><th>Category</th><th>Daily rate</th>
        <th>Created</th><th>Expires</th><th>Status</th><th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="listing : ${listings}">
        <td th:text="${listing.title}"></td>
        <td>
            <a th:href="@{/admin/users/{id}(id=${listing.ownerId})}" th:text="${listing.ownerName}"></a>
            <span th:unless="${listing.ownerActive}">(deactivated)</span>
        </td>
        <td th:text="${listing.category.label}"></td>
        <td th:text="${listing.dailyRate} + ' AUD'"></td>
        <td th:text="${#temporals.format(listing.createdAt, 'd MMM yyyy')}"></td>
        <td th:text="${listing.expiryDate}"></td>
        <td th:text="${listing.status.label}"></td>
        <td>
            <form th:if="${listing.status.name() == 'PUBLISHED' or listing.status.name() == 'EXPIRED'}"
                  th:action="@{/admin/listings/{id}/remove(id=${listing.id})}"
                  method="post"
                  onsubmit="return confirm('Remove this listing?')">
                <input type="text" name="reason" maxlength="500" placeholder="Reason" required>
                <button type="submit">Remove</button>
            </form>
            <form th:if="${listing.status.name() == 'REMOVED' and listing.ownerActive}"
                  th:action="@{/admin/listings/{id}/restore(id=${listing.id})}"
                  method="post"
                  onsubmit="return confirm('Restore this listing?')">
                <input type="text" name="reason" maxlength="500" placeholder="Reason" required>
                <button type="submit">Restore</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/admin}">Back to admin</a></p>

</body>
</html>
