<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>

<body>

<h1>Your Profile</h1>

<p>
    Name:
    <span th:text="${user.name}"></span>
</p>

<p>
    Email:
    <span th:text="${user.email}"></span>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">
        Logout
    </button>
</form>

</body>
</html>
