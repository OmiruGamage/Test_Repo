<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

<h1>Login to GearHub</h1>

<p th:if="${param.error}">
    Invalid email or password.
</p>

<p th:if="${param.logout}">
    You have been logged out.
</p>

<p th:if="${param.deactivated}">
    This account has been deactivated by an administrator.
</p>

<p th:if="${param.registered}">
    Account created successfully!
</p>

<form th:action="@{/login}" method="post">

    <div>
        <label for="email">Email</label>

        <input
            id="email"
            name="email"
            type="email"
            required>
    </div>

    <div>
        <label for="password">Password</label>

        <input
            id="password"
            name="password"
            type="password"
            required>
    </div>

    <button type="submit">
        Login
    </button>

</form>

<a th:href="@{/register}">
    Create an account
</a>

</body>
</html>
