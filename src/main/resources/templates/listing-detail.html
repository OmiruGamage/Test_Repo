<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listing Detail</title>
</head>

<body>

<div th:if="${listing == null}">
    <p>This listing is no longer available.</p>
</div>

<div th:if="${listing != null}">

    <h1 th:text="${listing.title}"></h1>

    <img th:if="${thumbnailPhotoId != null}"
         th:src="@{/listings/photos/{photoId}(photoId=${thumbnailPhotoId})}"
         alt="">

    <p th:text="${listing.category.label}"></p>
    <p th:text="${listing.condition.label}"></p>
    <p th:text="${listing.dailyRate} + ' AUD / day'"></p>
    <p th:text="${listing.pickupSuburb} + ' ' + ${listing.pickupPostcode}"></p>

    <p th:if="${listing.description != null}"
       th:text="${listing.description}"></p>

    <p>
        Listed by <span th:text="${owner.name}"></span>
        &mdash; <span>No ratings yet</span>
    </p>

    <button th:unless="${isOwner}" type="button">
        Request to Rent
    </button>

</div>

<p>
    <a th:href="@{/}">Back to browse</a>
</p>

</body>
</html>
